        // Download functionality
        function downloadDeck() {
            const date = new Date().toLocaleDateString();
            const deckContent = `# AnySync Strategy & Viability Deck
Generated: ${date}
Based on PRD v2.0.0

## 1. Executive Summary
- **Viability Index:** 82/100 (PROCEED with caution on scope)
- **Differentiation:** HIGH (Pivot to Agentic AI workflows separates AnySync from legacy tools)
- **Development Risk:** MED-HIGH (Multi-agent orchestration requires niche talent and limits initial speed-to-market)

## 2. The Solution (Core Pillars)
1. **Conversational BI (F1):** Drop SQL queries. Ask questions in plain English, get instant charts and summaries.
2. **Deep Analytics (F5):** RAG-powered agents comb through databases and unstructured data to find the hidden "Why".
3. **Agentic Actions (F6):** Prescriptive orchestrator recommends actionable steps and executes workflows.
4. **Visual Reporting (F4):** Transform conversational threads into real-time dashboards instantly.
5. **Scheduled Delivery (F2):** Put data on autopilot with complex reports routed automatically.

## 3. SWOT Analysis
**Strengths:**
- Modern Architecture (K8s, Agentic routing)
- Security First (Presidio integration)

**Weaknesses:**
- Scope Creep (Massive surface area for a V1 MVP)
- Integration Overhead (Universal DB connectors are taxing)

**Opportunities:**
- Legacy Disruption (Tableau/PowerBI are too complex for average users)
- App Store Model (F7 Marketplace creates a sticky ecosystem)

**Threats:**
- Incumbent AI (Microsoft Copilot, Salesforce Einstein)
- API Costs (Heavy LLM orchestration could compress margins)

## 4. Strategic Recommendations
1. **Prioritize F1 & F6 (Moats):** Conversational BI and Orchestration are the primary value drivers. Build these robustly before expanding UI features.
2. **Scope Down MVP Integrations:** Instead of "Universal" connections on day 1, focus strictly on PostgreSQL + Salesforce to validate the core logic.
3. **Lead with Presidio Security:** Enterprise buyers fear LLM data leaks. Use the built-in PII redaction as your tip-of-the-spear marketing message.

## 5. Use Case: HIMS Integration
- **The Challenge:** Fragmented legacy systems (Epic, Cerner) across US, EU, and MENA need modern workflows without ripping and replacing.
- **Three-Plane Architecture:** Data Plane (Read-Only), Intelligence Plane (Genkit/PII Masking), Action Plane (Human-in-the-Loop approvals).
- **Key Workflows:** 1. Doctors: Combating click-fatigue via ClinicalContextAgent.
  2. Admins: Predictive capacity via OpsOrchestratorAgent.
  3. Accounting: Revenue leakage prevention via RevenueReconciliationAgent.

## 6. Reality Check (Signals & Risks)
### What the application gets right (Strong Signals)
1. **The problem is real and painful:** Solves manual reporting, fragmented data, and leadership wanting answers now. You are not inventing a problem.
2. **Not "another Copilot":** Differentiated by cross-system orchestration, human-in-the-loop, and strict auditability.
3. **Architecture aligns with reality:** The Action/Intelligence/Data plane split matches governance and security requirements perfectly.

### Where this will fail (Red Flags)
1. **Platform gravity risk:** If the roadmap starts with "First we build the platform," it will die slowly. Avoid trying to support all use cases and competing with giants.
2. **"AI theater" risk:** Multi-agent orchestration means nothing if users don't see value in week 1-4. Leadership funds hours saved, not architectural elegance.
3. **Ownership & mandate risk:** Sits between Data, IT, Business, and Security. If no one clearly owns data access and error handling, it becomes politically fragile.
`;

            // Create a Blob containing the markdown content
            const blob = new Blob([deckContent], { type: 'text/markdown' });

            // Create a temporary anchor element and trigger the download
            const a = document.createElement('a');
            const url = URL.createObjectURL(blob);

            a.click();

            // Cleanup
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 0);
        }
